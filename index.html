<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>风应有语</title>

    <link
      rel="icon"
      type="image/svg+xml"
      href="https://img2.baidu.com/it/u=4124500709,3024728543&fm=253&fmt=auto&app=120&f=JPEG?w=500&h=500"
    />

    <style>
      :root {
        --bg: #f6f8fc;
        --card-bg: #ffffff;
        --text: #1f2933;
        --text-sub: #838fa2;
        --accent: #4f7cff;
        --accent-2: #9b5cff;
        --shadow: 0 8px 30px rgba(31, 41, 51, 0.08);
        --radius: 16px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 68px 20px 32px;
        background-image:
          radial-gradient(
            1200px 500px at 10% -10%,
            rgba(79, 124, 255, 0.12),
            transparent
          ),
          radial-gradient(
            1000px 500px at 110% 10%,
            rgba(155, 92, 255, 0.12),
            transparent
          );
        background-image: url("https://fengling68.github.io/imgbed/images-upic-picture/infinity-1660823-1668178111980.jpg");
        background-repeat: no-repeat;
        background-position: center;
        background-size: cover;
      }

      .container {
        width: 100%;
        max-width: 1280px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* 头像 */
      .avatar {
        width: 112px;
        height: 112px;
        border-radius: 50%;
        object-fit: cover;
        border: 4px solid #fff;
        box-shadow: var(--shadow);
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
      }

      /* 标题与副标题 */
      .site-title {
        margin: 34px 0 8px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.5px;
      }
      .site-subtitle {
        margin-bottom: 36px;
        font-size: 15px;
        color: var(--text-sub);
        text-align: center;
        line-height: 1.6;
        max-width: 520px;
      }

      /* 链接卡片网格 */
      .links {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      @media (max-width: 540px) {
        .links {
          grid-template-columns: 1fr;
        }
      }

      .link-card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 18px;
        background: var(--card-bg);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        text-decoration: none;
        color: var(--text);
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease;
      }
      .link-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 36px rgba(31, 41, 51, 0.14);
      }
      .link-icon {
        width: 44px;
        height: 44px;
        flex: 0 0 44px;
        border-radius: 12px;
        object-fit: cover;
        background: #eef2ff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 22px;
      }
      .link-text {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .link-title {
        font-size: 16px;
        font-weight: 600;
      }
      .link-host {
        font-size: 12px;
        color: var(--text-sub);
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      /* 页脚 */
      .footer {
        position: fixed;
        bottom: 20px;
        left: 0;
        right: 0;
        margin-top: 40px;
        font-size: 13px;
        color: var(--text-sub);
        text-align: center;
      }
      .footer a {
        color: var(--accent);
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- 头像 -->
      <img class="avatar" id="avatar" alt="头像" />

      <!-- 标题 -->
      <h1 class="site-title" id="siteTitle"></h1>
      <p class="site-subtitle" id="siteSubtitle"></p>

      <!-- 链接区域（由 urlConfig 渲染） -->
      <nav class="links" id="links"></nav>

      <footer class="footer">
        <span id="footerText"></span>
      </footer>
    </div>

    <script>
      /* =========================================================
       配置区：部署前改这里即可，无需改动其它代码
       ========================================================= */

      function randomImg(index) {
        const images = [
          "https://img0.baidu.com/it/u=40927327,384196320&fm=253&fmt=auto&app=120&f=JPEG?w=500&h=500",
          "https://img1.baidu.com/it/u=1817372115,523866616&fm=253&fmt=auto&app=120&f=JPEG?w=500&h=505",
          "https://img1.baidu.com/it/u=1661296314,4231064054&fm=253&fmt=auto&app=120&f=JPEG?w=500&h=500",
          "https://img0.baidu.com/it/u=1890990618,3230203456&fm=253&fmt=auto&app=138&f=JPEG?w=500&h=500",
        ];
        return images[index] || images[0];
      }

      // 站点基本信息
      const siteConfig = {
        title: "风应有语", // 显示在页面大标题
        subtitle: "风月无古今，情怀自浅深，唯心所造。", // 小文案
        avatar:
          "https://img1.baidu.com/it/u=1796625923,747815485&fm=253&fmt=auto&app=120&f=JPEG?w=800&h=800", // 头像图片链接；留空则用默认渐变占位
        footer:
          "© " +
          new Date().getFullYear() +
          " 由 WorkBuddy 生成 · Powered by GitHub Pages",
      };

      // 网站链接配置
      const urlConfig = [
        {
          title: "GitHub",
          subtitle: "奇思妙想天马行空",
          link: "https://fengling68.github.io/",
          image: "https://avatars.githubusercontent.com/u/88468872?v=4",
        },
        {
          title: "我的博客",
          subtitle: "生活因记录而美好",
          link: "https://fengling68.github.io/MyBlogs/",
          image: randomImg(1),
        },
        {
          title: "我的工具",
          subtitle: "工欲善其事必先利其器",
          link: "https://fengling68.github.io/MyAllTools/",
          image: randomImg(2),
        },
      ];

      /* =========================================================
       渲染逻辑
       ========================================================= */

      // 头像
      const avatarEl = document.getElementById("avatar");
      if (siteConfig.avatar) {
        avatarEl.src = siteConfig.avatar;
      } else {
        // 无头像链接时，用首字符占位
        avatarEl.remove();
        const ph = document.createElement("div");
        ph.className = "avatar";
        ph.style.display = "flex";
        ph.style.alignItems = "center";
        ph.style.justifyContent = "center";
        ph.style.color = "#fff";
        ph.style.fontSize = "44px";
        ph.style.fontWeight = "700";
        ph.textContent = (siteConfig.title || "Me")
          .trim()
          .charAt(0)
          .toUpperCase();
        avatarEl.parentNode.insertBefore(ph, avatarEl);
      }

      document.getElementById("siteTitle").textContent = siteConfig.title;
      document.title = siteConfig.title;
      document.getElementById("siteSubtitle").textContent = siteConfig.subtitle;
      document.getElementById("footerText").textContent = siteConfig.footer;

      // 链接卡片
      const linksEl = document.getElementById("links");
      function hostOf(url) {
        try {
          return new URL(url).hostname;
        } catch (e) {
          return url;
        }
      }
      urlConfig.forEach(function (item) {
        const a = document.createElement("a");
        a.className = "link-card";
        a.href = item.link;
        a.target = "_blank";
        a.rel = "noopener noreferrer";

        const icon = document.createElement("div");
        icon.className = "link-icon";
        if (item.image && /^https?:\/\//i.test(item.image)) {
          const img = document.createElement("img");
          img.src = item.image;
          img.alt = item.title;
          img.style.width = "100%";
          img.style.height = "100%";
          img.style.borderRadius = "12px";
          img.onerror = function () {
            icon.textContent = "🔗";
            img.remove();
          };
          icon.appendChild(img);
        } else {
          icon.textContent = item.image || "🔗";
        }

        const text = document.createElement("div");
        text.className = "link-text";
        const t = document.createElement("div");
        t.className = "link-title";
        t.textContent = item.title;
        const h = document.createElement("div");
        h.className = "link-host";
        h.textContent = item.subtitle;
        text.appendChild(t);
        text.appendChild(h);
        a.appendChild(icon);
        a.appendChild(text);
        linksEl.appendChild(a);
      });
    </script>
  </body>
</html>
