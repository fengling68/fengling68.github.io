<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>A股选股面板</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#1c2026;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  font-size:12px;line-height:1.5}
.wrap{width:100%;padding:0 14px 40px}
header{background:linear-gradient(135deg,#1b3a5c 0%,#2c5f8d 100%);color:#fff;
  padding:11px 0;margin-bottom:12px}
header .wrap{padding-bottom:0;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
h1{margin:0;font-size:19px;letter-spacing:.5px;white-space:nowrap}
.ttl{position:relative;display:flex;align-items:center;gap:6px}
.help{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;
  width:16px;height:16px;border-radius:50%;font-size:11px;line-height:1;font-weight:700;
  background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.4);
  color:#fff;user-select:none;flex:none}
.help:hover{background:rgba(255,255,255,.36)}
.pop{display:none;position:absolute;top:24px;left:0;z-index:60;width:560px;max-width:86vw;
  padding:10px 13px;background:#fff;color:#454b53;border:1px solid #dfe4ea;
  border-radius:9px;box-shadow:0 8px 24px rgba(20,30,45,.18);
  font-size:11.5px;line-height:1.8;text-align:left}
.pop.on{display:block}
.pop b{color:#1b3a5c}
.hdiv{width:1px;height:15px;background:rgba(255,255,255,.3)}
.sub{opacity:.92;font-size:11.5px}
.badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.badge{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.25);
  padding:1px 8px;border-radius:10px;font-size:10.5px}
.up{color:#d92b2b}.down{color:#12a150}.flat{color:#6b7280}
.tabs{display:flex;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.tab{padding:4px 16px;border:1px solid #dfe3e8;background:#fff;border-radius:8px;
  cursor:pointer;font-size:13px;color:#4b5563;font-weight:600}
.tab:hover{border-color:#2c5f8d;color:#1b3a5c}
.tab.on{background:#1b3a5c;border-color:#1b3a5c;color:#fff}
.tab span{font-weight:400;font-size:10.5px;opacity:.75;margin-left:4px}
.subtabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.stab{padding:1px 9px;border:1px solid #e4e7ec;background:#fff;border-radius:10px;
  cursor:pointer;font-size:11.5px;color:#4b5563}
.stab:hover{border-color:#2c5f8d;background:#f0f6fb}
.stab.on{background:#2c5f8d;border-color:#2c5f8d;color:#fff;font-weight:600}
.stab.z0{color:#c0c4c9}
.stab i{font-style:normal;font-size:10px;opacity:.7;margin-left:3px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.chips{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.chip{padding:1px 8px;border:1px solid #dfe3e8;background:#fff;border-radius:9px;
  cursor:pointer;font-size:11px;color:#4b5563}
.chip.on{background:#1b3a5c;border-color:#1b3a5c;color:#fff;font-weight:600}
.sep{width:1px;height:14px;background:#e4e7ec}
.bar input{margin:0;padding:3px 9px;border:1px solid #d9dde3;border-radius:7px;
  font-size:11.5px;background:#fff;width:170px;outline:none}
.cnt{margin-left:auto;font-size:11.5px;color:#6b7280}
.cnt b{color:#1b3a5c;font-size:13px}
.tblwrap{overflow:auto;max-height:calc(100vh - 190px);background:#fff;
  border:1px solid #e4e7ec;border-radius:10px;position:relative}
table{border-collapse:separate;border-spacing:0;font-size:11.5px;width:100%}
th{background:#eef2f6;padding:5px 7px;text-align:right;font-weight:600;color:#1b3a5c;
  position:sticky;top:0;z-index:3;white-space:nowrap;cursor:pointer;
  border-bottom:1px solid #d9dee5;user-select:none}
th:hover{background:#e2e9f0}
th.l,td.l{text-align:left}
th.mid,td.mid{text-align:center}
th.sorted{background:#dce6f0;color:#0f2c47}
th .ar{font-size:9px;opacity:.8}
td{padding:4px 7px;border-bottom:1px solid #f0f2f5;white-space:nowrap;text-align:right}
tr:nth-child(even) td{background:#fafbfc}
tr:hover td{background:#eef4fa}
td.code{color:#8a9099;font-size:10.5px}
td.nm{font-weight:700;color:#1c2026}
td.ind{color:#5a6070;font-size:10.5px}
td.tagline{text-align:left;color:#6b7280;font-size:10.5px;white-space:normal}
.mk{display:inline-block;padding:0 4px;border-radius:3px;font-size:10px;margin-right:2px}
.mk.z{background:#fdeaea;color:#c0392b;border:1px solid #f2b8b8}
.mk.y{background:#fff6e6;color:#b07a10;border:1px solid #f0dcae}
.mk.t{background:#eef6fd;color:#25639c;border:1px solid #c3ddf2}
.gtag{display:inline-block;padding:0 4px;margin-right:2px;border-radius:3px;
  font-size:10px;background:#f2f6fa;color:#1b3a5c;border:1px solid #d9e4ef}
.pos{background:#fdeaea}
.loading{padding:14px;text-align:center;color:#8a9099;font-size:11.5px}
.empty{padding:30px;text-align:center;color:#8a9099;font-size:12px}
@keyframes fadeIn{from{opacity:.4}to{opacity:1}}
.pop{animation:fadeIn .12s ease-out}
@media(max-width:1200px){.col-opt{display:none}}
</style>
</head>
<body>
<header><div class="wrap">
<div class="ttl">
  <h1>A股选股面板</h1>
  <span class="help" id="helpBtn" title="数据口径与筛选说明">?</span>
  <div class="pop" id="helpPop"></div>
</div>
  <span class="hdiv"></span>
  <div class="sub" id="metaInfo">加载中…</div>
  <span class="sub" id="liveStatus" style="color:#ffd98a"></span>
  <div class="badges" id="badges"></div>
</div></header>

<div class="wrap">
  <div class="tabs" id="tabs1"></div>
  <div class="subtabs" id="tabs2"></div>
  <div class="bar">
    <input id="q" placeholder="搜索代码 / 名称 / 行业…">
    <div class="chips" id="chips"></div>
    <div class="cnt" id="cnt"></div>
  </div>
  <div class="tblwrap" id="tblwrap">
    <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
    <div class="loading" id="loading" style="display:none">滚动加载更多…</div>
  </div>
  <div class="empty" id="empty" style="display:none">该分类下暂无股票</div>
</div>

<script src="./StockSelection/picks-data.js"></script>
<script src="./StockSelection/holders.js"></script>
<script src="./StockSelection/render.js"></script>
<script src="./StockSelection/live.js"></script>
<script>
if (!window.PICK_DATA) {
  document.getElementById('empty').style.display = '';
  document.getElementById('empty').textContent =
    '数据文件未加载：请确认 StockSelection-picks-data.js / StockSelection-holders.js 与本页面在同一目录。';
}
</script>
</body>
</html>
